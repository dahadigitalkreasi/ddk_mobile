name: Recover Android Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Encrypt original keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BACKUP_PASSWORD: ${{ secrets.KEYSTORE_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$KEYSTORE_BASE64"
          test -n "$BACKUP_PASSWORD"

          mkdir -p "$RUNNER_TEMP/keystore-backup"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

          test -s "$RUNNER_TEMP/upload-keystore.jks"

          openssl enc -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 200000 \
            -in "$RUNNER_TEMP/upload-keystore.jks" \
            -out "$RUNNER_TEMP/keystore-backup/upload-keystore.jks.enc" \
            -pass env:BACKUP_PASSWORD

          rm -f "$RUNNER_TEMP/upload-keystore.jks"

          test -s "$RUNNER_TEMP/keystore-backup/upload-keystore.jks.enc"

          echo "Encrypted keystore backup created."

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-android-keystore
          path: ${{ runner.temp }}/keystore-backup/upload-keystore.jks.enc
          retention-days: 1
          if-no-files-found: error