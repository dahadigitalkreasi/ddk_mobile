
name: DahaDigitalKreasi Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Shorebird APK
    runs-on: ubuntu-latest

    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      # ================================
      # 1. AMBIL SOURCE CODE
      # ================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ================================
      # 2. SETUP JAVA
      # ================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ================================
      # 3. SETUP FLUTTER
      # ================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # ================================
      # 4. SETUP SHOREBIRD
      # ================================
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # ================================
      # 5. INSTALL DEPENDENCIES
      # ================================
      - name: Install Dependencies
        run: flutter pub get

      # ================================
      # 6. VERIFIKASI VERSI RELEASE
      # ================================
      - name: Verify Release Version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml \
            | awk '{print $2}' \
            | cut -d'+' -f1)

          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "ERROR: Versi pubspec.yaml tidak sesuai tag."
            echo "Pubspec: $VERSION"
            echo "Tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "Versi release valid: $VERSION"

      # ================================
      # 7. CEK KONFIGURASI SHOREBIRD
      # ================================
      - name: Verify Shorebird Configuration
        shell: bash
        run: |
          test -f shorebird.yaml || {
            echo "ERROR: shorebird.yaml tidak ditemukan."
            echo "Jalankan shorebird init di project dan commit file tersebut."
            exit 1
          }

          test -n "$SHOREBIRD_TOKEN" || {
            echo "ERROR: SHOREBIRD_TOKEN belum tersedia."
            exit 1
          }

          shorebird --version
          echo "Konfigurasi Shorebird tersedia."

      # ================================
      # 8. RESTORE ANDROID SIGNING
      # ================================
      - name: Restore Android Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 belum tersedia"
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "ERROR: STORE_PASSWORD belum tersedia"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD belum tersedia"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS belum tersedia"
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

          echo "Android signing berhasil disiapkan."

      # ================================
      # 9. PERIKSA KODE FLUTTER
      # ================================
      - name: Flutter Analyze
        run: flutter analyze

      # ================================
      # 10. BUILD APK MENGGUNAKAN SHOREBIRD
      # ================================
      - name: Build Shorebird Android APK
        shell: bash
        env:
          REVERB_WS_URL: ${{ vars.REVERB_WS_URL }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
        run: |
          ARGS=(
            --artifact apk
            --flutter-version=3.47.9
            --dart-define=API_BASE_URL=https://sandbox.dahakreasidigital.my.id/api
          )

          if [ -n "$REVERB_WS_URL" ] && [ -n "$REVERB_APP_KEY" ]; then
            ARGS+=(
              "--dart-define=REVERB_WS_URL=$REVERB_WS_URL"
              "--dart-define=REVERB_APP_KEY=$REVERB_APP_KEY"
            )
          elif [ -n "$REVERB_WS_URL" ] || [ -n "$REVERB_APP_KEY" ]; then
            echo "ERROR: Konfigurasi Reverb belum lengkap."
            exit 1
          else
            echo "Reverb belum dikonfigurasi untuk build ini."
          fi

          shorebird release android "${ARGS[@]}"

      # ================================
      # 11. SIAPKAN APK HASIL BUILD
      # ================================
      - name: Prepare APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK Shorebird tidak ditemukan."
            find build/app/outputs -name "*.apk" -type f || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" "release/DDK-Mobile-${GITHUB_REF_NAME}.apk"

          echo "APK Shorebird siap diunggah."

      # ================================
      # 12. UPLOAD APK ARTIFACT
      # ================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DahaDigitalKreasi-Shorebird-APK
          path: release/*.apk
          if-no-files-found: error

      # ================================
      # 13. PUBLIKASIKAN GITHUB RELEASE
      # ================================
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.apk \
            --title "DDK Mobile $GITHUB_REF_NAME - Shorebird OTA" \
            --generate-notes \
            --verify-tag
