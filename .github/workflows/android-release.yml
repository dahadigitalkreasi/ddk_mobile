
name: DahaDigitalKreasi Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Prepare Shorebird APK Release
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: https://sandbox.dahakreasidigital.my.id/api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Release Version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml \
            | awk '{print $2}' \
            | cut -d'+' -f1)

          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Versi pubspec.yaml tidak sesuai tag."
            echo "Pubspec: $VERSION"
            echo "Tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "Versi valid: $VERSION"

      - name: Verify VPS Configuration
        shell: bash
        run: |
          echo "Target API VPS: $API_BASE_URL"

      - name: Create Draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "DDK Mobile $GITHUB_REF_NAME - Shorebird OTA" \
            --generate-notes \
            --verify-tag \
            --draft
