
name: DahaDigitalKreasi Shorebird Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Shorebird APK
    runs-on: ubuntu-latest

    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Verify Release Version
        shell: bash
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME="${VERSION%%+*}"

          if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "ERROR: Versi pubspec.yaml tidak sesuai tag."
            exit 1
          fi

          test -n "$SHOREBIRD_TOKEN" || {
            echo "ERROR: SHOREBIRD_TOKEN belum tersedia."
            exit 1
          }

      - name: Restore Android Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for VAR in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            test -n "${!VAR}" || {
              echo "ERROR: Missing signing configuration: $VAR"
              exit 1
            }
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Shorebird Release
        shell: bash
        env:
          REVERB_WS_URL: ${{ vars.REVERB_WS_URL }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
        run: |
          ARGS=(
            --artifact apk
            --flutter-version=3.47.9
            --dart-define=API_BASE_URL=https://sandbox.dahakreasidigital.my.id/api
          )

          if [ -z "$REVERB_WS_URL" ]; then
            echo "ERROR: REVERB_WS_URL belum tersedia."
            exit 1
          fi

          if [ -z "$REVERB_APP_KEY" ]; then
            echo "ERROR: REVERB_APP_KEY belum tersedia."
            exit 1
          fi

          echo "REVERB_WS_URL: $REVERB_WS_URL"
          echo "REVERB_APP_KEY tersedia."
          echo "Panjang APP KEY: ${#REVERB_APP_KEY}"

          ARGS+=(
            "--dart-define=REVERB_WS_URL=$REVERB_WS_URL"
            "--dart-define=REVERB_APP_KEY=$REVERB_APP_KEY"
          )

          shorebird release android "${ARGS[@]}"

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK Shorebird tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDK-Shorebird-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create Draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "ERROR: Release sudah tersedia."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "DDK Mobile $GITHUB_REF_NAME - Shorebird OTA" \
            --generate-notes \
            --verify-tag \
            --draft
